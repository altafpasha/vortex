<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:300px;background:#030507;color:#c8d8e8;font-family:'Space Mono',monospace;padding:20px}
  .brand{color:#00d4ff;font-size:18px;font-weight:700;letter-spacing:5px}
  .sub{color:#4a6070;font-size:9px;letter-spacing:3px;margin-bottom:20px}
  label{display:block;font-size:9px;color:#00d4ff;letter-spacing:3px;margin:14px 0 5px}
  input{width:100%;background:#0a0e14;border:1px solid #1a2535;color:#e8f4ff;font-family:monospace;font-size:11px;padding:9px 10px;outline:none}
  input:focus{border-color:#00d4ff}
  .btn{width:100%;margin-top:14px;background:#00d4ff;color:#030507;border:none;padding:11px;font-weight:700;font-size:11px;letter-spacing:3px;cursor:pointer}
  .btn:hover{background:#33ddff}
  .status{margin-top:12px;font-size:10px;letter-spacing:1px;padding:8px 10px;display:none}
  .ok{display:block;background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.2);color:#00ff88}
  .err{display:block;background:rgba(255,61,90,.1);border:1px solid rgba(255,61,90,.2);color:#ff3d5a}
  .info{display:block;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.2);color:#00d4ff}
  .hint{font-size:9px;color:#4a6070;letter-spacing:1px;margin-top:12px;line-height:1.6}
</style>
</head>
<body>
  <div class="brand">VORTEX</div>
  <div class="sub">COOKIE SYNC</div>

  <label>SERVER URL</label>
  <input type="url" id="serverUrl" placeholder="https://vortex.codesec.me"/>

  <label>VORTEX PASSWORD</label>
  <input type="password" id="password" placeholder="Your Vortex login password"/>

  <button class="btn" id="saveBtn">SAVE &amp; SYNC NOW</button>

  <div class="status" id="status"></div>

  <div class="hint">
    Auto-syncs every 6 hours when Chrome is open.<br/>
    Cookies are sent when you're signed into YouTube.
  </div>

  <script src="popup.js"></script>
</body>
</html>
