services:
  backend:
    build: ./backend
    container_name: vortex-backend
    restart: unless-stopped
    volumes:
      - ./downloads:/app/downloads
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - vortex-net

  frontend:
    build: ./frontend
    container_name: vortex-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - vortex-net

networks:
  vortex-net:
    driver: bridge

